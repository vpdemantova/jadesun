<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020">
<title>Porta · 1440</title>
<rect id="Fundo" width="1440" height="1020" fill="#FFFFFF"/>
<g id="Barra de cima"><rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="64" x2="1440" y2="64" stroke="#D6D6D6"/><rect x="60" y="16" width="96" height="32" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">Buscar</text><text x="180" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757">Nota</text><text x="664" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Atlas</text><text x="587" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Guias</text><text x="510" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Obras</text><text x="433" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Manifesto</text><rect x="709" y="21" width="22" height="22" fill="#0B0B0B"/><text x="776" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Hoje</text><text x="844.4" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Caderno</text><text x="938.5999999999999" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Eu</text><text x="989.8" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Casa</text><text x="1300" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757" text-anchor="end">Corrido</text><text x="1380" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757" text-anchor="end">Ajustes</text></g><g id="Conteúdo"><g id="O nome da porta"><rect x="60" y="104" width="872" height="160" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="134" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O nome da porta</text><text x="76" y="156" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">e a pergunta que ela responde</text></g><g id="O que mudou"><rect x="956" y="104" width="424" height="160" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="972" y="134" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que mudou</text><text x="972" y="156" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as últimas páginas mexidas, com a data</text></g><g id="As páginas da porta"><rect x="60" y="288" width="1320" height="260" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="318" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">As páginas da porta</text><text x="76" y="340" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">em texto corrido: o nome, o que responde, o que há dentro</text></g><g id="O destaque"><rect x="60" y="572" width="872" height="320" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="602" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O destaque</text><text x="76" y="624" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a vista principal da porta</text></g><g id="Atalhos"><rect x="956" y="572" width="424" height="320" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="972" y="602" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Atalhos</text><text x="972" y="624" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o que se faz daqui</text></g></g><g id="Barra de baixo"><rect x="0" y="956" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="956" x2="1440" y2="956" stroke="#D6D6D6"/><text x="60" y="993" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757">Dentro de &lt;porta&gt;:</text><text x="196" y="993" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">as páginas da porta, a atual marcada</text><line x1="720" y1="974" x2="720" y2="1002" stroke="#D6D6D6"/><text x="760" y="993" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">os tópicos desta página, o atual acompanha a rolagem</text><text x="1380" y="993" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757" text-anchor="end">Nesta página</text></g>
</svg>
