<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1252" viewBox="0 0 390 1252">
<title>Porta · 390</title>
<rect id="Fundo" width="390" height="1252" fill="#FFFFFF"/>
<g id="Barra de cima"><rect x="0" y="0" width="390" height="56" fill="#FFFFFF"/><line x1="0" y1="56" x2="390" y2="56" stroke="#D6D6D6"/><rect x="16" y="12" width="80" height="32" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="30" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">Buscar</text><rect x="185" y="18" width="20" height="20" fill="#0B0B0B"/><text x="374" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="end">Ajustes</text></g><g id="Conteúdo"><g id="O nome da porta"><rect x="16" y="76" width="358" height="144" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="106" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O nome da porta</text><text x="32" y="128" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">e a pergunta que ela responde</text></g><g id="O que mudou"><rect x="16" y="232" width="358" height="144" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="262" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que mudou</text><text x="32" y="284" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as últimas páginas mexidas, com a data</text></g><g id="As páginas da porta"><rect x="16" y="388" width="358" height="234" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="418" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">As páginas da porta</text><text x="32" y="440" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">em texto corrido: o nome, o que responde, o que há</text><text x="32" y="458" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">dentro</text></g><g id="O destaque"><rect x="16" y="634" width="358" height="224" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="664" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O destaque</text><text x="32" y="686" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a vista principal da porta</text></g><g id="Atalhos"><rect x="16" y="870" width="358" height="224" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="900" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Atalhos</text><text x="32" y="922" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o que se faz daqui</text></g></g><g id="Barras de baixo"><rect x="8" y="1126" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="22" y="1148" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Dentro de &lt;porta&gt;</text><text x="22" y="1165" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">a página atual</text><rect x="199" y="1126" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="213" y="1148" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Nesta página</text><text x="213" y="1165" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">o tópico atual</text><rect x="0" y="1188" width="390" height="64" fill="#FFFFFF"/><line x1="0" y1="1188" x2="390" y2="1188" stroke="#D6D6D6"/><text x="39" y="1225" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Guias</text><text x="117" y="1225" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Atlas</text><rect x="185" y="1210" width="20" height="20" fill="#0B0B0B"/><text x="273" y="1225" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Hoje</text><text x="351" y="1225" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Caderno</text></g>
