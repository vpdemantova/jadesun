<body data-pagina="area">
  <div class="casca">
    <aside class="trilho" id="trilho"></aside>
    <main class="miolo">
      <div class="faixa" id="faixa" aria-hidden="true"></div>
      <nav id="dm2-trilho" class="deitado"></nav>
      <div id="ar"></div>
    </main>
  </div>
  <script src="md.js" defer></script>
  <script src="domino-mais.js" defer></script>
  <script src="cartao.js" defer></script>
  <script src="dominio.js" defer></script>
  <script src="area.js" defer></script>
  <script>
    /* A CASCA: a única parte que conhece a URL. ?m=Química escolhe a área;
       #n=QUI-07 abre um estudo; #museu, #praticas… levam a um módulo; #p-QUI-P1, a uma prática.
       Para remodelar as rotas, troque só isto (o componente está em area.js). */
    window.addEventListener('DOMContentLoaded', function () {
      var m = new URLSearchParams(location.search).get('m') || 'Linguagens';
      if (window.Area.materias.indexOf(m) < 0) m = 'Linguagens';
      var a = null, trilho = null, raizEl = document.getElementById('ar');
      /* o menu fixo das matérias (o mesmo do Domínio). 25/out/2026 (registro 118): as áreas como botões,
         a matéria troca a área na hora, sem recarregar; o endereço muda (?m=), e o voltar do navegador volta */
      function montarArea(nome, estudo) {
        if (a && a.destruir) a.destruir();
        m = nome;
        document.title = m + ' · área — Portal Solar';
        a = window.Area.montar(raizEl, {
          materia: m,
          estudo: estudo,
          aoMudar: function (e) {
            var h = e.estudo ? '#n=' + e.estudo : (e.modulo && e.modulo !== 'mapa' ? '#' + e.modulo : '');
            try { history.replaceState(history.state, '', location.pathname + location.search + h); } catch (x) { /* file: */ }
          },
        });
        if (trilho) trilho.marcar(m);
        return a;
      }
      function trocar(nome) {
        if (!nome || nome === m) return;
        try { history.pushState({ m: nome }, '', location.pathname + '?m=' + encodeURIComponent(nome)); } catch (x) { location.href = 'area.html?m=' + encodeURIComponent(nome); return; }
        montarArea(nome);
        if (window.Perfil && window.Perfil.lugarMudou) window.Perfil.lugarMudou();
        scrollTo({ top: 0 });
      }
      if (window.Dominio) trilho = window.Dominio.trilho(document.getElementById('dm2-trilho'), { modo: 'area', atual: m, aoEscolher: trocar });
      var estudo = (location.hash.match(/^#n=([A-Z]{3}-\d{2})$/) || [])[1];
      montarArea(m, estudo);
      window.addEventListener('popstate', function () {
        var n = new URLSearchParams(location.search).get('m') || 'Linguagens';
        if (window.Area.materias.indexOf(n) >= 0 && n !== m) { montarArea(n); if (window.Perfil && window.Perfil.lugarMudou) window.Perfil.lugarMudou(); }
      });
      function seguir() {
        var h = location.hash.slice(1), n = h.match(/^n=([A-Z]{3}-\d{2})$/), p = h.match(/^p-(.+)$/);
        if (n) a.selecionar(n[1]);
        else if (p) a.irPratica(p[1]);
        else if (window.Area.modulos.indexOf(h) >= 0) a.ir(h);
      }
      a.pronto.then(function () { if (!estudo) setTimeout(seguir, 60); });
      window.addEventListener('hashchange', seguir);
    });
  </script>
</body>
</html>
