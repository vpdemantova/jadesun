<body data-pagina="atlas">
  <div class="casca">
    <aside class="trilho" id="trilho"></aside>
    <main class="miolo">
      <div class="faixa" id="faixa" aria-hidden="true"></div>
      <header class="topo-pg at-topo">
        <p class="rot"><span id="atlas-quando"></span><span id="atlas-hora"></span></p>
        <div class="at-topo-grade">
          <div class="at-topo-texto">
            <h1 class="mega">O Atlas da Terra<em>tudo o que a humanidade sabe, fez e pode fazer</em></h1>
            <form class="atlas-busca" id="atlas-busca" role="search">
              <input type="search" id="atlas-q" placeholder="Buscar em todas as fichas: Darwin, 1789, fotossíntese…" aria-label="Buscar em todas as fichas" autocomplete="off">
              <button class="botao pri" type="submit">Buscar</button>
            </form>
          </div>
          <div class="at-numeros" id="at-numeros" aria-live="polite"></div>
        </div>
      </header>
      <div id="atlas" aria-live="polite"><p class="rot suave">Abrindo o mapa…</p></div>
    </main>
  </div>
