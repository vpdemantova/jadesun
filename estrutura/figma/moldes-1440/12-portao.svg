<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="904" viewBox="0 0 1440 904">
<title>Portão (o primeiro acesso) · 1440</title>
<rect id="Fundo" width="1440" height="904" fill="#FFFFFF"/>
<g id="Barra de cima"><rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="64" x2="1440" y2="64" stroke="#D6D6D6"/><rect x="60" y="16" width="96" height="32" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">Buscar</text><text x="180" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757">Nota</text><text x="664" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Atlas</text><text x="587" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Guias</text><text x="510" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Obras</text><text x="433" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Manifesto</text><rect x="709" y="21" width="22" height="22" fill="#0B0B0B"/><text x="776" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Hoje</text><text x="844.4" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Caderno</text><text x="938.5999999999999" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Eu</text><text x="989.8" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Casa</text><text x="1300" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757" text-anchor="end">Corrido</text><text x="1380" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757" text-anchor="end">Ajustes</text></g><g id="Conteúdo"><g id="O que é"><rect x="284" y="104" width="872" height="200" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="300" y="134" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que é</text><text x="300" y="156" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o Portal é uma lente sobre uma pasta sua; desligue-o e tudo continua lá</text></g><g id="Escolher a pasta"><rect x="284" y="328" width="424" height="200" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="300" y="358" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Escolher a pasta</text><text x="300" y="380" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">no computador ou no celular</text></g><g id="Começar do modelo"><rect x="732" y="328" width="424" height="200" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="748" y="358" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Começar do modelo</text><text x="748" y="380" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o acervo-modelo, para preencher</text></g><g id="Só ler"><rect x="284" y="552" width="872" height="80" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="300" y="582" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Só ler</text><text x="300" y="604" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o acervo público, sem pasta nenhuma</text></g><g id="Onde ficam os seus arquivos"><rect x="284" y="656" width="872" height="120" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="300" y="686" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Onde ficam os seus arquivos</text><text x="300" y="708" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">no seu disco; a conta é a chave da casa, não o cofre</text></g></g><g id="Barra de baixo"><rect x="0" y="840" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="840" x2="1440" y2="840" stroke="#D6D6D6"/><text x="60" y="877" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757">Dentro de &lt;porta&gt;:</text><text x="196" y="877" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">as páginas da porta, a atual marcada</text><line x1="720" y1="858" x2="720" y2="886" stroke="#D6D6D6"/><text x="760" y="877" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">os tópicos desta página, o atual acompanha a rolagem</text><text x="1380" y="877" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757" text-anchor="end">Nesta página</text></g>
</svg>
