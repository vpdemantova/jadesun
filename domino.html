<body data-pagina="domino">
  <!-- O Domínio (09/out/2026, PERFIL.md item 74): o mapa geral, com seis vistas. A página antiga (mosaico + lista)
       virou duas das vistas; o arquivo domino.js antigo continua na pasta, sem uso. -->
  <div class="casca">
    <aside class="trilho" id="trilho"></aside>
    <main class="miolo">
      <header class="topo-pg dm2-topo" id="dm2-topo">
        <p class="rot"><span class="num-pg">Hoje › Domínio</span><span id="dm2-resumo"></span></p>
        <h1 class="mega">O mapa geral<em>o que a prova pede, e o que você já domina</em></h1>
        <p class="resposta">Matéria por matéria: as unidades, os estudos e os subtópicos de cada estudo, e a área inteira de cada matéria. Um subtópico está dominado quando você <b>resolveria uma questão dele sem abrir o cursinho</b>.</p>
        <div class="dm2-placar" id="dm2-placar" aria-live="polite"></div>
      </header>
      <div class="dm2-pagina">
        <nav id="dm2-trilho"></nav>
        <div id="dm2"></div>
        <div id="dm2-area" class="dm2-area-vista" hidden></div>
      </div>
    </main>
  </div>
  <script src="cartao.js" defer></script>
  <script src="dominio.js" defer></script>
  <script>
    /* a casca: monta o mapa e o menu das matérias; #m-quimica rola até a matéria.
       25/out/2026 (registro 118): as áreas como botões. "as áreas não devem ser toggle, mas sim botões pra
       mudar mais rapidamente, e ver tudo mais eficientemente". A matéria escolhida no menu da esquerda (ou no
       botão "A área de …" do mapa) troca o mapa pela área inteira dela, na hora, sem recarregar; "Tudo" volta
       ao mapa. O endereço guarda a escolha (#area=Geografia e, com um estudo aberto, &n=GEO-05): a bola de
       volta, o voltar do navegador e as fixadas andam com ele. */
    window.addEventListener('DOMContentLoaded', function () {
      var D = window.Dominio;
      var mapaEl = document.getElementById('dm2'), areaEl = document.getElementById('dm2-area'), titulo = document.title;
      var areaApi = null, areaNome = null;
      var trilho = D.trilho(document.getElementById('dm2-trilho'), { modo: 'dominio', aoEscolher: escolher });
      var mapa = D.montar(mapaEl, { aoPedirArea: escolher });
      function lerArea() { var m = location.hash.match(/^#area=([^&]+)/); var n = m ? decodeURIComponent(m[1]) : null; return n && D.ORDEM.indexOf(n) >= 0 ? n : null; }
      function escolher(nome) {
        var alvo = nome ? '#area=' + encodeURIComponent(nome) : '#mapa';
        if (location.hash.replace(/&.*$/, '') !== alvo) location.hash = alvo; else aplicar();
        var pg = document.querySelector('.dm2-pagina');
        if (pg && pg.getBoundingClientRect().top < 0) pg.scrollIntoView({ block: 'start' });
      }
      function aplicar() {
        var nome = lerArea();
        trilho.marcar(nome);
        if (!nome) {
          areaEl.hidden = true; mapaEl.hidden = false; document.title = titulo;
          var h = location.hash.match(/^#m-(.+)$/);
          if (h) { var s = document.getElementById('m-' + h[1]); if (s) setTimeout(function () { s.scrollIntoView({ block: 'start' }); }, 80); }
          return;
        }
        mapaEl.hidden = true; areaEl.hidden = false;
        document.title = nome + ' · Domínio — Portal Solar';
        if (areaNome === nome && areaApi) return;
        if (areaApi && areaApi.destruir) areaApi.destruir();
        areaNome = nome; areaApi = null;
        areaEl.innerHTML = '<p class="rot suave">Abrindo ' + nome + '…</p>';
        D.carregarArea().then(function () {
          if (areaNome !== nome) return;
          areaEl.innerHTML = '';
          var n0 = (location.hash.match(/[&#]n=([A-Z]{3}-\d{2})/) || [])[1];
          areaApi = window.Area.montar(areaEl, {
            materia: nome, estudo: n0, ids: false,
            aoMudar: function (e) {
              var h2 = '#area=' + encodeURIComponent(nome) + (e.estudo ? '&n=' + e.estudo : '');
              try { history.replaceState(history.state, '', location.pathname + location.search + h2); } catch (x) { /* file: */ }
            },
          });
        }).catch(function () { areaEl.innerHTML = '<p class="rot suave">Não consegui abrir a área agora.</p>'; });
      }
      window.addEventListener('hashchange', aplicar);
      function placar() {
        var M = D.modelo(); if (!M) return;
        var pct = function (f) { return Math.round(f * 100) + '%'; };
        var n = M.n;
        document.getElementById('dm2-resumo').textContent = n.feitos + ' / ' + n.total + ' marcados';
        var total = M.materias.reduce(function (s, m) { return s + m.n.total; }, 0) || 1;
        document.getElementById('dm2-placar').innerHTML =
          '<div class="dm2-pl-num"><b>' + pct(M.frac) + '</b><span>do mapa inteiro</span></div>' +
          '<div class="dm2-pl-num"><b>' + n.cf + '<small>/' + n.c + '</small></b><span>subtópicos dominados</span></div>' +
          '<div class="dm2-pl-num"><b>' + n.iF + '<small>/' + n.i + '</small></b><span>itens da prova</span></div>' +
          '<div class="dm2-pl-num"><b>' + n.estDom + '<small>/' + n.est + '</small></b><span>estudos inteiros</span></div>' +
          '<div class="dm2-pl-faixa" role="img" aria-label="As nove matérias, do tamanho de cada uma, cheias do quanto já foi marcado">' + M.materias.map(function (m) {
            return '<a class="' + m.cor + '" href="#m-' + D.slug(m.nome) + '" style="flex:' + m.n.total + ' 1 0;--f:' + m.frac.toFixed(3) + '" title="' + m.nome + ': ' + m.n.feitos + '/' + m.n.total + '"><i></i><span>' + m.nome + '</span></a>';
          }).join('') + '</div>';
      }
      D.aoMudar(placar);
      mapa.pronto.then(function () { placar(); aplicar(); });
      if (lerArea()) aplicar();
    });
  </script>
</body>
</html>
