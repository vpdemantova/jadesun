<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1208" viewBox="0 0 1760 1208">
<title>Portal Solar · os produtos no hub</title>
<rect id="Fundo" width="1760" height="1208" fill="#FFFFFF"/>
<text x="60" y="70" font-family="Archivo, Arial, sans-serif" font-size="40" font-weight="800" fill="#0B0B0B">Os produtos no hub</text><text x="60" y="104" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" font-style="italic" fill="#575757">cada produto sobe um degrau de cada vez; o primeiro custa um arquivo .md</text><g id="Degrau: Ficha"><rect x="60" y="140" width="520" height="96" rx="12" fill="#0B0B0B"/><text x="80" y="176" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">1. Ficha</text><text x="80" y="204" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#FFFFFF">o produto tem a sua ficha nas Obras: o que é, quem fez, o estado, o</text><text x="80" y="222" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#FFFFFF">endereço</text><g id="vitordemantova.com"><rect x="60" y="260" width="520" height="97" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="288" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">vitordemantova.com</text><text x="78" y="308" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o site pessoal, a revista</text><text x="78" y="332" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#0B0B0B">→ casca: a vitrine do Vitor (lente revista)</text></g><g id="Vitor Petri"><rect x="60" y="371" width="520" height="97" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="399" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Vitor Petri</text><text x="78" y="419" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o portfólio em galeria 3D</text><text x="78" y="443" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#0B0B0B">→ casca: a lente espaço sobre as obras</text></g><g id="Jardim Serafim"><rect x="60" y="482" width="520" height="97" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="510" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Jardim Serafim</text><text x="78" y="530" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o jogo da vila onde ninguém come sozinho</text><text x="78" y="554" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#0B0B0B">→ motor: as etapas reais da obra viram trabalho no jogo</text></g><g id="Vilageoise"><rect x="60" y="593" width="520" height="97" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="621" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Vilageoise</text><text x="78" y="641" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a cidade de luz (jogo)</text><text x="78" y="665" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#0B0B0B">→ casca</text></g><g id="Paz por Contraponto"><rect x="60" y="704" width="520" height="97" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="732" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Paz por Contraponto</text><text x="78" y="752" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a música e o Violino Turul</text><text x="78" y="776" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#0B0B0B">→ casca</text></g><g id="Sistema Quântico"><rect x="60" y="815" width="520" height="97" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="843" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Sistema Quântico</text><text x="78" y="863" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">os instrumentos de harmonia</text><text x="78" y="887" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#0B0B0B">→ casca</text></g><g id="Plaza"><rect x="60" y="926" width="520" height="97" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="954" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Plaza</text><text x="78" y="974" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a praça em 3D</text><text x="78" y="998" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#0B0B0B">→ casca (lente espaço)</text></g><g id="A oficina"><rect x="60" y="1037" width="520" height="97" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="1065" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A oficina</text><text x="78" y="1085" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">texturas e motores gráficos</text><text x="78" y="1109" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#0B0B0B">→ motor (já entrou no repositório do motor como oficina/)</text></g><path d="M588 188 L612 188 M604 181 L612 188 L604 195" fill="none" stroke="#0B0B0B" stroke-width="2"/></g><g id="Degrau: Casca"><rect x="620" y="140" width="520" height="96" rx="12" fill="#0B0B0B"/><text x="640" y="176" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">2. Casca</text><text x="640" y="204" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#FFFFFF">abre dentro do hub: a mesma barra, as mesmas letras, o Quadrado, a volta</text><text x="640" y="222" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#FFFFFF">num gesto</text><g id="Portal Solar (este app)"><rect x="620" y="260" width="520" height="97" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="638" y="288" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Portal Solar (este app)</text><text x="638" y="308" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">Atlas, Guias, Hoje, Eu, Casa, Manifesto: as páginas de hoje</text><text x="638" y="332" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#0B0B0B">→ motor (entra no repositório do motor como casa/, ver UNIAO.md)</text></g><path d="M1148 188 L1172 188 M1164 181 L1172 188 L1164 195" fill="none" stroke="#0B0B0B" stroke-width="2"/></g><g id="Degrau: Motor"><rect x="1180" y="140" width="520" height="96" rx="12" fill="#0B0B0B"/><text x="1200" y="176" font-family="Archivo, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">3. Motor</text><text x="1200" y="204" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#FFFFFF">lê e escreve a mesma pasta, pela mesma Porta: local-first de verdade</text><g id="O motor e os três corpos"><rect x="1180" y="260" width="520" height="115" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="1198" y="288" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O motor e os três corpos</text><text x="1198" y="308" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o núcleo puro e as portas do disco; o site, o Portátil (PWA) e o</text><text x="1198" y="326" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">Aplicativo (mesa e Android)</text><text x="1198" y="350" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#0B0B0B">→ o próprio hub</text></g><g id="O acervo"><rect x="1180" y="389" width="520" height="97" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="1198" y="417" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O acervo</text><text x="1198" y="437" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a pasta de arquivos .md: estantes 0 a 3 (de todos) e A a C (de cada um)</text><text x="1198" y="461" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#0B0B0B">→ é a verdade; a interface é a lente</text></g></g>
</svg>
