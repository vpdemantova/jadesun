<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2110" viewBox="0 0 1440 2110">
<title>Início · 1440</title>
<rect id="Fundo" width="1440" height="2110" fill="#FFFFFF"/>
<g id="Barra de cima"><rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="64" x2="1440" y2="64" stroke="#D6D6D6"/><rect x="60" y="16" width="96" height="32" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">Buscar</text><text x="180" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757">Nota</text><text x="664" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Atlas</text><text x="587" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Guias</text><text x="510" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Obras</text><text x="433" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Manifesto</text><rect x="709" y="21" width="22" height="22" fill="#0B0B0B"/><text x="776" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Hoje</text><text x="844.4" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Caderno</text><text x="938.5999999999999" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Eu</text><text x="989.8" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Casa</text><text x="1300" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757" text-anchor="end">Corrido</text><text x="1380" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757" text-anchor="end">Ajustes</text></g><g id="Conteúdo"><g id="O aviso"><rect x="60" y="104" width="1320" height="150" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="134" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O aviso</text><text x="76" y="156" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">faixa em tinta cheia: emergencial e provisória (enquanto durar)</text></g><g id="O que importa agora"><rect x="60" y="278" width="1320" height="250" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="308" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que importa agora</text><text x="76" y="330" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as causas · o mundo · os avanços · as tecnologias · as tendências (cinco colunas; no celular, texto corrido)</text></g><g id="Na sua área"><rect x="60" y="552" width="200" height="80" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="582" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Na sua área</text></g><g id="As áreas e a escolhida"><rect x="284" y="552" width="1096" height="80" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="300" y="582" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">As áreas e a escolhida</text><text x="300" y="604" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">chips; a área em texto corrido</text></g><g id="O Quadrado"><rect x="60" y="656" width="200" height="210" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="686" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O Quadrado</text><text x="76" y="708" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a marca</text></g><g id="O que é"><rect x="284" y="656" width="760" height="210" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="300" y="686" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que é</text><text x="300" y="708" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">título e um parágrafo corrido</text></g><g id="A necessidade"><rect x="1068" y="656" width="312" height="210" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="1084" y="686" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A necessidade</text><text x="1084" y="708" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">uma frase, e por quê</text></g><g id="O Mundo"><rect x="60" y="890" width="424" height="220" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="920" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O Mundo</text><text x="76" y="942" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as quatro portas, cada uma com a pergunta</text></g><g id="Você"><rect x="508" y="890" width="424" height="220" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="524" y="920" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Você</text><text x="524" y="942" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as quatro portas da pessoa</text></g><g id="As Obras"><rect x="956" y="890" width="424" height="220" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="972" y="920" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">As Obras</text><text x="972" y="942" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o que se faz sobre o Portal</text></g><g id="A Terra agora"><rect x="60" y="1134" width="1320" height="420" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="1164" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A Terra agora</text><text x="76" y="1186" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">lente mapa: dia e noite deste minuto</text></g><g id="As revoluções"><rect x="60" y="1578" width="1320" height="300" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="1608" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">As revoluções</text><text x="76" y="1630" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">lente tempo: da formação da Terra à revolução ontológica</text></g><g id="Quem fez"><rect x="60" y="1902" width="200" height="80" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="1932" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Quem fez</text></g><g id="A assinatura"><rect x="284" y="1902" width="1096" height="80" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="300" y="1932" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A assinatura</text><text x="300" y="1954" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o movimento e as três frases</text></g></g><g id="Barra de baixo"><rect x="0" y="2046" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="2046" x2="1440" y2="2046" stroke="#D6D6D6"/><text x="60" y="2083" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757">Dentro de &lt;porta&gt;:</text><text x="196" y="2083" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">as páginas da porta, a atual marcada</text><line x1="720" y1="2064" x2="720" y2="2092" stroke="#D6D6D6"/><text x="760" y="2083" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">os tópicos desta página, o atual acompanha a rolagem</text><text x="1380" y="2083" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757" text-anchor="end">Nesta página</text></g>
</svg>
