<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1488" viewBox="0 0 1440 1488">
<title>Hoje · 1440</title>
<rect id="Fundo" width="1440" height="1488" fill="#FFFFFF"/>
<g id="Barra de cima"><rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="64" x2="1440" y2="64" stroke="#D6D6D6"/><rect x="60" y="16" width="96" height="32" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">Buscar</text><text x="180" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757">Nota</text><text x="664" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Atlas</text><text x="587" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Guias</text><text x="510" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Obras</text><text x="433" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Manifesto</text><rect x="709" y="21" width="22" height="22" fill="#0B0B0B"/><text x="776" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Hoje</text><text x="844.4" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Caderno</text><text x="938.5999999999999" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Eu</text><text x="989.8" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Casa</text><text x="1300" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757" text-anchor="end">Corrido</text><text x="1380" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757" text-anchor="end">Ajustes</text></g><g id="Conteúdo"><g id="O dia"><rect x="60" y="104" width="872" height="200" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="134" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O dia</text><text x="76" y="156" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a data grande e o arco do sol de hoje</text></g><g id="Meu dia"><rect x="956" y="104" width="424" height="200" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="972" y="134" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Meu dia</text><text x="972" y="156" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o que estou fazendo, o cronômetro</text></g><g id="Agora"><rect x="60" y="328" width="872" height="240" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="358" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Agora</text><text x="76" y="380" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a tarefa do momento, com o guia ao lado</text></g><g id="Prazos"><rect x="956" y="328" width="424" height="240" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="972" y="358" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Prazos</text><text x="972" y="380" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">em ordem, com os dias</text></g><g id="O caminho de cada área"><rect x="60" y="592" width="1320" height="260" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="622" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O caminho de cada área</text><text x="76" y="644" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o próximo estudo, o que vem antes e depois</text></g><g id="Domínio"><rect x="60" y="876" width="1320" height="300" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="906" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Domínio</text><text x="76" y="928" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o mapa geral, na lente escolhida</text></g><g id="Esperando você"><rect x="60" y="1200" width="648" height="160" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="1230" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Esperando você</text><text x="76" y="1252" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as decisões que são suas</text></g><g id="Para respirar"><rect x="732" y="1200" width="648" height="160" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="748" y="1230" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Para respirar</text><text x="748" y="1252" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o jardim, o protetor</text></g></g><g id="Barra de baixo"><rect x="0" y="1424" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="1424" x2="1440" y2="1424" stroke="#D6D6D6"/><text x="60" y="1461" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757">Dentro de &lt;porta&gt;:</text><text x="196" y="1461" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">as páginas da porta, a atual marcada</text><line x1="720" y1="1442" x2="720" y2="1470" stroke="#D6D6D6"/><text x="760" y="1461" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">os tópicos desta página, o atual acompanha a rolagem</text><text x="1380" y="1461" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757" text-anchor="end">Nesta página</text></g>
</svg>
