<g id="Barra de cima"><rect x="0" y="0" width="390" height="56" fill="#FFFFFF"/><line x1="0" y1="56" x2="390" y2="56" stroke="#D6D6D6"/><rect x="16" y="12" width="80" height="32" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="30" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">Buscar</text><rect x="185" y="18" width="20" height="20" fill="#0B0B0B"/><text x="374" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="end">Ajustes</text></g><g id="Conteúdo"><g id="A capa"><rect x="16" y="76" width="358" height="224" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="106" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A capa</text><text x="32" y="128" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o nome, quem fez, o estado (em obra, no ar,</text><text x="32" y="146" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">guardado)</text></g><g id="O que é"><rect x="16" y="312" width="358" height="234" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="342" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que é</text><text x="32" y="364" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">texto corrido</text></g><g id="A ficha técnica"><rect x="16" y="558" width="358" height="234" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="588" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A ficha técnica</text><text x="32" y="610" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">tábua: tipo, ano, código, licença, endereço</text></g><g id="Abrir"><rect x="16" y="804" width="358" height="50" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="833" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B0B0B">Abrir</text><text x="90" y="833" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">aqui · à parte · os arquivos</text></g><g id="O nível"><rect x="16" y="866" width="358" height="50" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="895" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B0B0B">O nível</text><text x="106.80000000000001" y="895" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">ficha · casca · motor (o quanto já est…</text></g><g id="A obra em si"><rect x="16" y="928" width="358" height="252" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="958" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A obra em si</text><text x="32" y="980" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">imagens, a cena ou o próprio app (lente grade ou</text><text x="32" y="998" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">espaço)</text></g><g id="Os elos"><rect x="16" y="1192" width="358" height="144" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1222" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Os elos</text><text x="32" y="1244" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">quem fez, o que usa, de onde veio</text></g></g><g id="Barras de baixo"><rect x="8" y="1368" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="22" y="1390" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Dentro de &lt;porta&gt;</text><text x="22" y="1407" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">a página atual</text><rect x="199" y="1368" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="213" y="1390" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Nesta página</text><text x="213" y="1407" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">o tópico atual</text><rect x="0" y="1430" width="390" height="64" fill="#FFFFFF"/><line x1="0" y1="1430" x2="390" y2="1430" stroke="#D6D6D6"/><text x="39" y="1467" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Guias</text><text x="117" y="1467" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Atlas</text><rect x="185" y="1452" width="20" height="20" fill="#0B0B0B"/><text x="273" y="1467" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Hoje</text><text x="351" y="1467" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Caderno</text></g>
