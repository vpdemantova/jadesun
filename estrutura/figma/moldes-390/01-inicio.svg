<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2519" viewBox="0 0 390 2519">
<title>Início · 390</title>
<rect id="Fundo" width="390" height="2519" fill="#FFFFFF"/>
<g id="Barra de cima"><rect x="0" y="0" width="390" height="56" fill="#FFFFFF"/><line x1="0" y1="56" x2="390" y2="56" stroke="#D6D6D6"/><rect x="16" y="12" width="80" height="32" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="30" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">Buscar</text><rect x="185" y="18" width="20" height="20" fill="#0B0B0B"/><text x="374" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="end">Ajustes</text></g><g id="Conteúdo"><g id="O aviso"><rect x="16" y="76" width="358" height="135" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="106" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O aviso</text><text x="32" y="128" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">faixa em tinta cheia: emergencial e provisória</text><text x="32" y="146" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">(enquanto durar)</text></g><g id="O que importa agora"><rect x="16" y="223" width="358" height="225" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="253" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que importa agora</text><text x="32" y="275" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as causas · o mundo · os avanços · as tecnologias</text><text x="32" y="293" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">· as tendências (cinco colunas; no celular, texto</text><text x="32" y="311" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">corrido)</text></g><g id="Na sua área"><rect x="16" y="460" width="358" height="44" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="487" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B0B0B">Na sua área</text></g><g id="As áreas e a escolhida"><rect x="16" y="516" width="358" height="72" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="546" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">As áreas e a escolhida</text><text x="32" y="568" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">chips; a área em texto corrido</text></g><g id="O Quadrado"><rect x="16" y="600" width="358" height="95" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="630" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O Quadrado</text><text x="32" y="652" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a marca</text></g><g id="O que é"><rect x="16" y="707" width="358" height="189" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="737" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que é</text><text x="32" y="759" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">título e um parágrafo corrido</text></g><g id="A necessidade"><rect x="16" y="908" width="358" height="95" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="938" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A necessidade</text><text x="32" y="960" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">uma frase, e por quê</text></g><g id="O Mundo"><rect x="16" y="1015" width="358" height="198" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1045" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O Mundo</text><text x="32" y="1067" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as quatro portas, cada uma com a pergunta</text></g><g id="Você"><rect x="16" y="1225" width="358" height="198" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1255" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Você</text><text x="32" y="1277" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as quatro portas da pessoa</text></g><g id="As Obras"><rect x="16" y="1435" width="358" height="198" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1465" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">As Obras</text><text x="32" y="1487" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o que se faz sobre o Portal</text></g><g id="A Terra agora"><rect x="16" y="1645" width="358" height="294" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1675" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A Terra agora</text><text x="32" y="1697" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">lente mapa: dia e noite deste minuto</text></g><g id="As revoluções"><rect x="16" y="1951" width="358" height="270" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1981" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">As revoluções</text><text x="32" y="2003" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">lente tempo: da formação da Terra à revolução</text><text x="32" y="2021" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">ontológica</text></g><g id="Quem fez"><rect x="16" y="2233" width="358" height="44" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="2260" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B0B0B">Quem fez</text></g><g id="A assinatura"><rect x="16" y="2289" width="358" height="72" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="2319" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A assinatura</text><text x="32" y="2341" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o movimento e as três frases</text></g></g><g id="Barras de baixo"><rect x="8" y="2393" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="22" y="2415" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Dentro de &lt;porta&gt;</text><text x="22" y="2432" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">a página atual</text><rect x="199" y="2393" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="213" y="2415" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Nesta página</text><text x="213" y="2432" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">o tópico atual</text><rect x="0" y="2455" width="390" height="64" fill="#FFFFFF"/><line x1="0" y1="2455" x2="390" y2="2455" stroke="#D6D6D6"/><text x="39" y="2492" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Guias</text><text x="117" y="2492" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Atlas</text><rect x="185" y="2477" width="20" height="20" fill="#0B0B0B"/><text x="273" y="2492" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Hoje</text><text x="351" y="2492" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Caderno</text></g>
</svg>
