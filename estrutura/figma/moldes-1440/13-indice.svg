="946" stroke="#D6D6D6"/><text x="760" y="937" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">os tópicos desta página, o atual acompanha a rolagem</text><text x="1380" y="937" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757" text-anchor="end">Nesta página</text></g>
