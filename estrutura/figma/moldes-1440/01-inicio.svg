<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2048" viewBox="0 0 1440 2048">
<title>Início · 1440</title>
<rect id="Fundo" width="1440" height="2048" fill="#FFFFFF"/>
<g id="Barra de cima"><rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="64" x2="1440" y2="64" stroke="#D6D6D6"/><rect x="60" y="16" width="96" height="32" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="78" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">Buscar</text><text x="180" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757">Nota</text><text x="664" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Atlas</text><text x="587" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Guias</text><text x="510" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Obras</text><text x="433" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757" text-anchor="end">Manifesto</text><rect x="709" y="21" width="22" height="22" fill="#0B0B0B"/><text x="776" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Hoje</text><text x="844.4" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Caderno</text><text x="938.5999999999999" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Eu</text><text x="989.8" y="37" font-family="Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#575757">Casa</text><text x="1300" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757" text-anchor="end">Corrido</text><text x="1380" y="37" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#575757" text-anchor="end">Ajustes</text></g><g id="Conteúdo"><g id="As boas-vindas"><rect x="396" y="104" width="648" height="420" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="412" y="134" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">As boas-vindas</text><text x="412" y="156" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o Quadrado grande, o nome, o lema (&quot;Somos projetos do Sol…&quot;), o dia de hoje; e, para quem</text><text x="412" y="174" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">volta, onde parou e a fixada</text></g><g id="O mundo"><rect x="60" y="548" width="536" height="520" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="578" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O mundo</text><text x="76" y="600" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as portas do lado esquerdo do menu, alinhadas ao eixo: o nome, a pergunta, as</text><text x="76" y="618" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">páginas</text></g><g id="O Quadrado"><rect x="620" y="548" width="200" height="520" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="636" y="578" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O Quadrado</text><text x="636" y="600" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o mapa de tudo, no eixo</text></g><g id="Você"><rect x="844" y="548" width="536" height="520" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="860" y="578" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Você</text><text x="860" y="600" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as portas do lado direito, alinhadas ao eixo</text></g><g id="O que queremos"><rect x="284" y="1092" width="872" height="300" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="300" y="1122" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que queremos</text><text x="300" y="1144" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a utopia, nas palavras dele (A revolução ontológica, lida do caderno)</text></g><g id="A Terra agora"><rect x="60" y="1416" width="1320" height="420" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="1446" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A Terra agora</text><text x="76" y="1468" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">lente mapa: dia e noite deste minuto</text></g><g id="A linha da obra"><rect x="60" y="1860" width="1320" height="60" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="1890" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A linha da obra</text><text x="76" y="1912" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">Portal Solar · uma obra de Vitor de Mantova · interface provisória · O que importa agora · Os créditos · Doar</text></g></g><g id="Barra de baixo"><rect x="0" y="1984" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="1984" x2="1440" y2="1984" stroke="#D6D6D6"/><text x="60" y="2021" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757">Dentro de &lt;porta&gt;:</text><text x="196" y="2021" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">as páginas da porta, a atual marcada</text><line x1="720" y1="2002" x2="720" y2="2030" stroke="#D6D6D6"/><text x="760" y="2021" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">os tópicos desta página, o atual acompanha a rolagem</text><text x="1380" y="2021" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757" text-anchor="end">Nesta página</text></g>
</svg>
