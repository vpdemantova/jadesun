<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1902" viewBox="0 0 390 1902">
<title>Hoje · 390</title>
<rect id="Fundo" width="390" height="1902" fill="#FFFFFF"/>
<g id="Barra de cima"><rect x="0" y="0" width="390" height="56" fill="#FFFFFF"/><line x1="0" y1="56" x2="390" y2="56" stroke="#D6D6D6"/><rect x="16" y="12" width="80" height="32" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="30" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">Buscar</text><rect x="185" y="18" width="20" height="20" fill="#0B0B0B"/><text x="374" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="end">Ajustes</text></g><g id="Conteúdo"><g id="O dia"><rect x="16" y="76" width="358" height="180" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="106" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O dia</text><text x="32" y="128" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a data grande e o arco do sol de hoje</text></g><g id="Meu dia"><rect x="16" y="268" width="358" height="180" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="298" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Meu dia</text><text x="32" y="320" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o que estou fazendo, o cronômetro</text></g><g id="Agora"><rect x="16" y="460" width="358" height="216" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="490" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Agora</text><text x="32" y="512" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a tarefa do momento, com o guia ao lado</text></g><g id="Prazos"><rect x="16" y="688" width="358" height="216" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="718" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Prazos</text><text x="32" y="740" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">em ordem, com os dias</text></g><g id="O caminho de cada área"><rect x="16" y="916" width="358" height="234" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="946" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O caminho de cada área</text><text x="32" y="968" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o próximo estudo, o que vem antes e depois</text></g><g id="Domínio"><rect x="16" y="1162" width="358" height="270" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1192" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Domínio</text><text x="32" y="1214" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o mapa geral, na lente escolhida</text></g><g id="Esperando você"><rect x="16" y="1444" width="358" height="144" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1474" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Esperando você</text><text x="32" y="1496" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as decisões que são suas</text></g><g id="Para respirar"><rect x="16" y="1600" width="358" height="144" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1630" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Para respirar</text><text x="32" y="1652" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o jardim, o protetor</text></g></g><g id="Barras de baixo"><rect x="8" y="1776" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="22" y="1798" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Dentro de &lt;porta&gt;</text><text x="22" y="1815" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">a página atual</text><rect x="199" y="1776" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="213" y="1798" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Nesta página</text><text x="213" y="1815" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">o tópico atual</text><rect x="0" y="1838" width="390" height="64" fill="#FFFFFF"/><line x1="0" y1="1838" x2="390" y2="1838" stroke="#D6D6D6"/><text x="39" y="1875" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Guias</text><text x="117" y="1875" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Atlas</text><rect x="185" y="1860" width="20" height="20" fill="#0B0B0B"/><text x="273" y="1875" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Hoje</text><text x="351" y="1875" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Caderno</text></g>
</svg>
