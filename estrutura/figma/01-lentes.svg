<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1512" height="918" viewBox="0 0 1512 918">
<title>Portal Solar · as lentes</title>
<rect id="Fundo" width="1512" height="918" fill="#FFFFFF"/>
<text x="60" y="70" font-family="Archivo, Arial, sans-serif" font-size="40" font-weight="800" fill="#0B0B0B">As lentes</text><text x="60" y="104" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" font-style="italic" fill="#575757">o mesmo arquivo, outro olhar, nunca outra coisa; o corrido está em toda lente: é a lente desligada</text><g id="Lente: corrido"><rect x="60" y="140" width="330" height="330" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><rect x="84" y="164" width="169.2" height="12" rx="2" fill="#0B0B0B"/><rect x="84" y="194" width="282" height="7" rx="2" fill="#575757"/><rect x="84" y="212" width="270.71999999999997" height="7" rx="2" fill="#575757"/><rect x="84" y="230" width="282" height="7" rx="2" fill="#575757"/><rect x="84" y="248" width="253.8" height="7" rx="2" fill="#575757"/><rect x="84" y="266" width="276.36" height="7" rx="2" fill="#575757"/><rect x="84" y="284" width="197.39999999999998" height="7" rx="2" fill="#575757"/><text x="84" y="350" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B">corrido</text><text x="84" y="376" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">o arquivo como ele é, só texto; para ler; a</text><text x="84" y="394" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">prova de que a interface não inventa.</text><text x="84" y="430" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">precisa: nada · vale em: toda página e toda</text><text x="84" y="445" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">coleção</text></g><g id="Lente: lista"><rect x="414" y="140" width="330" height="330" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><rect x="438" y="164" width="14" height="14" rx="2" fill="#0B0B0B"/><rect x="462" y="167" width="141" height="8" rx="2" fill="#575757"/><line x1="438" y1="183" x2="720" y2="183" stroke="#D6D6D6"/><rect x="438" y="188" width="14" height="14" rx="2" fill="#0B0B0B"/><rect x="462" y="191" width="174.84" height="8" rx="2" fill="#575757"/><line x1="438" y1="207" x2="720" y2="207" stroke="#D6D6D6"/><rect x="438" y="212" width="14" height="14" rx="2" fill="#0B0B0B"/><rect x="462" y="215" width="208.68" height="8" rx="2" fill="#575757"/><line x1="438" y1="231" x2="720" y2="231" stroke="#D6D6D6"/><rect x="438" y="236" width="14" height="14" rx="2" fill="#0B0B0B"/><rect x="462" y="239" width="141" height="8" rx="2" fill="#575757"/><line x1="438" y1="255" x2="720" y2="255" stroke="#D6D6D6"/><rect x="438" y="260" width="14" height="14" rx="2" fill="#0B0B0B"/><rect x="462" y="263" width="174.84" height="8" rx="2" fill="#575757"/><line x1="438" y1="279" x2="720" y2="279" stroke="#D6D6D6"/><rect x="438" y="284" width="14" height="14" rx="2" fill="#0B0B0B"/><rect x="462" y="287" width="208.68" height="8" rx="2" fill="#575757"/><line x1="438" y1="303" x2="720" y2="303" stroke="#D6D6D6"/><text x="438" y="350" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B">lista</text><text x="438" y="376" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">uma coisa por linha, densa; para percorrer</text><text x="438" y="394" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">muitas.</text><text x="438" y="430" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">precisa: um nome · vale em: coleções, Índice,</text><text x="438" y="445" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">menus</text></g><g id="Lente: grade"><rect x="768" y="140" width="330" height="330" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><rect x="792" y="164" width="88.66666666666667" height="44" rx="4" fill="#0B0B0B"/><rect x="792" y="214" width="62.06666666666666" height="6" rx="2" fill="#575757"/><rect x="888.6666666666666" y="164" width="88.66666666666667" height="44" rx="4" fill="#D6D6D6"/><rect x="888.6666666666666" y="214" width="62.06666666666666" height="6" rx="2" fill="#575757"/><rect x="985.3333333333334" y="164" width="88.66666666666667" height="44" rx="4" fill="#D6D6D6"/><rect x="985.3333333333334" y="214" width="62.06666666666666" height="6" rx="2" fill="#575757"/><rect x="792" y="232" width="88.66666666666667" height="44" rx="4" fill="#D6D6D6"/><rect x="792" y="282" width="62.06666666666666" height="6" rx="2" fill="#575757"/><rect x="888.6666666666666" y="232" width="88.66666666666667" height="44" rx="4" fill="#D6D6D6"/><rect x="888.6666666666666" y="282" width="62.06666666666666" height="6" rx="2" fill="#575757"/><rect x="985.3333333333334" y="232" width="88.66666666666667" height="44" rx="4" fill="#D6D6D6"/><rect x="985.3333333333334" y="282" width="62.06666666666666" height="6" rx="2" fill="#575757"/><text x="792" y="350" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B">grade</text><text x="792" y="376" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">blocos lado a lado, com retrato; para</text><text x="792" y="394" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">comparar de relance.</text><text x="792" y="430" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">precisa: retrato (opcional) · vale em:</text><text x="792" y="445" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">coleções, Obras, Eu</text></g><g id="Lente: tábua"><rect x="1122" y="140" width="330" height="330" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><rect x="1146" y="164" width="62.5" height="9" rx="2" fill="#0B0B0B"/><rect x="1216.5" y="164" width="62.5" height="9" rx="2" fill="#0B0B0B"/><rect x="1287" y="164" width="62.5" height="9" rx="2" fill="#0B0B0B"/><rect x="1357.5" y="164" width="62.5" height="9" rx="2" fill="#0B0B0B"/><rect x="1146" y="186" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1216.5" y="186" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1287" y="186" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1357.5" y="186" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1146" y="208" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1216.5" y="208" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1287" y="208" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1357.5" y="208" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1146" y="230" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1216.5" y="230" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1287" y="230" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1357.5" y="230" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1146" y="252" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1216.5" y="252" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1287" y="252" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1357.5" y="252" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1146" y="274" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1216.5" y="274" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1287" y="274" width="62.5" height="7" rx="2" fill="#575757"/><rect x="1357.5" y="274" width="62.5" height="7" rx="2" fill="#575757"/><line x1="1146" y1="179" x2="1428" y2="179" stroke="#D6D6D6"/><line x1="1146" y1="201" x2="1428" y2="201" stroke="#D6D6D6"/><line x1="1146" y1="223" x2="1428" y2="223" stroke="#D6D6D6"/><line x1="1146" y1="245" x2="1428" y2="245" stroke="#D6D6D6"/><line x1="1146" y1="267" x2="1428" y2="267" stroke="#D6D6D6"/><text x="1146" y="350" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B">tábua</text><text x="1146" y="376" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">colunas alinhadas, campo a campo; para</text><text x="1146" y="394" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">comparar dados.</text><text x="1146" y="430" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">precisa: campos no cabeçalho · vale em:</text><text x="1146" y="445" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">coleções, Dados, ficha</text></g><g id="Lente: tempo"><rect x="60" y="494" width="330" height="330" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><line x1="84" y1="638" x2="366" y2="638" stroke="#0B0B0B" stroke-width="2"/><line x1="100.92" y1="632" x2="100.92" y2="644" stroke="#0B0B0B"/><circle cx="100.92" cy="616" r="5" fill="#0B0B0B"/><text x="100.92" y="662" font-family="Archivo, Arial, sans-serif" font-size="10" font-weight="400" fill="#575757" text-anchor="middle">1543</text><line x1="168.6" y1="632" x2="168.6" y2="644" stroke="#0B0B0B"/><circle cx="168.6" cy="590" r="5" fill="#0B0B0B"/><text x="168.6" y="662" font-family="Archivo, Arial, sans-serif" font-size="10" font-weight="400" fill="#575757" text-anchor="middle">1789</text><line x1="230.64000000000001" y1="632" x2="230.64000000000001" y2="644" stroke="#0B0B0B"/><circle cx="230.64000000000001" cy="616" r="5" fill="#0B0B0B"/><text x="230.64000000000001" y="662" font-family="Archivo, Arial, sans-serif" font-size="10" font-weight="400" fill="#575757" text-anchor="middle">1859</text><line x1="292.68" y1="632" x2="292.68" y2="644" stroke="#0B0B0B"/><circle cx="292.68" cy="590" r="5" fill="#0B0B0B"/><text x="292.68" y="662" font-family="Archivo, Arial, sans-serif" font-size="10" font-weight="400" fill="#575757" text-anchor="middle">1915</text><line x1="349.08" y1="632" x2="349.08" y2="644" stroke="#0B0B0B"/><circle cx="349.08" cy="616" r="5" fill="#0B0B0B"/><text x="349.08" y="662" font-family="Archivo, Arial, sans-serif" font-size="10" font-weight="400" fill="#575757" text-anchor="middle">2026</text><text x="84" y="704" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B">tempo</text><text x="84" y="730" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">a data à margem, em ordem de nascimento;</text><text x="84" y="748" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">para ver quando.</text><text x="84" y="784" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">precisa: data, nascimento, ano · vale em:</text><text x="84" y="799" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">coleções, revoluções, Caderno</text></g><g id="Lente: mapa"><rect x="414" y="494" width="330" height="330" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><ellipse cx="579" cy="587" rx="141" ry="63" fill="#F2F2F2" stroke="#D6D6D6"/><path d="M579 524 Q 635.4 593 579 650" fill="none" stroke="#D6D6D6"/><circle cx="522.6" cy="570.5" r="3.5" fill="#0B0B0B"/><circle cx="556.44" cy="600.5" r="6" fill="#0B0B0B"/><circle cx="612.84" cy="563" r="3.5" fill="#0B0B0B"/><circle cx="635.4" cy="608" r="3.5" fill="#0B0B0B"/><circle cx="494.4" cy="608" r="3.5" fill="#0B0B0B"/><circle cx="593.1" cy="585.5" r="3.5" fill="#0B0B0B"/><text x="438" y="704" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B">mapa</text><text x="438" y="730" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">onde: o globo, o mapa do saber, o mapa da</text><text x="438" y="748" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">matéria; para ver onde e quanto.</text><text x="438" y="784" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">precisa: onde/coordenadas ou área · vale em:</text><text x="438" y="799" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Atlas, Terra agora, Domínio, Museus</text></g><g id="Lente: rede"><rect x="768" y="494" width="330" height="330" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><line x1="933" y1="587" x2="831.48" y2="542" stroke="#D6D6D6"/><line x1="933" y1="587" x2="1028.88" y2="539" stroke="#D6D6D6"/><line x1="933" y1="587" x2="1045.8" y2="629" stroke="#D6D6D6"/><line x1="933" y1="587" x2="848.4" y2="638" stroke="#D6D6D6"/><line x1="933" y1="587" x2="933" y2="521" stroke="#D6D6D6"/><line x1="933" y1="587" x2="803.28" y2="590" stroke="#D6D6D6"/><line x1="933" y1="587" x2="1062.72" y2="584" stroke="#D6D6D6"/><line x1="831.48" y1="542" x2="933" y2="521" stroke="#D6D6D6"/><circle cx="831.48" cy="542" r="6" fill="#FFFFFF" stroke="#0B0B0B"/><circle cx="1028.88" cy="539" r="6" fill="#FFFFFF" stroke="#0B0B0B"/><circle cx="1045.8" cy="629" r="6" fill="#FFFFFF" stroke="#0B0B0B"/><circle cx="848.4" cy="638" r="6" fill="#FFFFFF" stroke="#0B0B0B"/><circle cx="933" cy="521" r="6" fill="#FFFFFF" stroke="#0B0B0B"/><circle cx="803.28" cy="590" r="6" fill="#FFFFFF" stroke="#0B0B0B"/><circle cx="1062.72" cy="584" r="6" fill="#FFFFFF" stroke="#0B0B0B"/><circle cx="933" cy="587" r="10" fill="#0B0B0B"/><text x="792" y="704" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B">rede</text><text x="792" y="730" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">os elos, em constelação; para ver o que se</text><text x="792" y="748" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">liga.</text><text x="792" y="784" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">precisa: [[elos]] e quem cita · vale em:</text><text x="792" y="799" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">ficha, Eu, Domínio, Índice</text></g><g id="Lente: espaço"><rect x="1122" y="494" width="330" height="330" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><polygon points="1287,543 1341,570 1287,597 1233,570" fill="#F2F2F2" stroke="#0B0B0B"/><polygon points="1233,570 1287,597 1287,651 1233,624" fill="#D6D6D6" stroke="#0B0B0B"/><polygon points="1341,570 1287,597 1287,651 1341,624" fill="#FFFFFF" stroke="#0B0B0B"/><text x="1146" y="704" font-family="Archivo, Arial, sans-serif" font-size="22" font-weight="800" fill="#0B0B0B">espaço</text><text x="1146" y="730" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">em 3D, como um lugar; para morar, guardar,</text><text x="1146" y="748" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#0B0B0B">passear.</text><text x="1146" y="784" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">precisa: nada (a casa é desenhada) · vale em:</text><text x="1146" y="799" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Casa, estante, esfera do Índice</text></g><g id="A lente da página"><text x="60" y="878" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A lente da página (um arquivo só):</text><text x="350" y="878" font-family="Newsreader, Georgia, serif" font-size="14" font-weight="400" fill="#575757">vestida: o traje do formato: ficha, wiki, manual, livro, publicação, atlas, casa</text><text x="870" y="878" font-family="Newsreader, Georgia, serif" font-size="14" font-weight="400" fill="#575757">corrido: só o que está escrito, nada mais</text></g>
