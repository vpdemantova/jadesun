<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="tema.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0F0E0B">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Museus — Portal Solar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Gabarito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&display=swap">
  <link rel="stylesheet" href="perfil.css">
  <link rel="stylesheet" href="fino.css">
  <link rel="stylesheet" href="vidro.css">
  <link rel="stylesheet" href="almanaque.css">
  <link rel="stylesheet" href="solar.css">
  <link rel="stylesheet" href="paginas.css">
  <link rel="stylesheet" href="museus.css">
  <link rel="stylesheet" href="forma.css">
  <script src="icones.js" defer></script>
  <script src="perfil.js" defer></script>
  <script src="solar.js" defer></script>
  <script src="meudia.js" defer></script>
  <script src="lenis.js" defer></script>
  <script src="motion.js" defer></script>
</head>
<body data-pagina="museus">
  <div class="casca">
    <aside class="trilho" id="trilho"></aside>
    <main class="miolo">
      <div class="faixa" id="faixa" aria-hidden="true"></div>
      <header class="topo-pg">
        <p class="rot"><span>Atlas · lista</span></p>
        <h1 class="mega">Museus e fundações</h1>
        <p class="resposta" id="mu-resumo">Os museus e as fundações da humanidade, por continente.</p>
      </header>

      <section class="mu-barra" aria-label="Filtros">
        <input id="mu-busca" class="mu-busca" type="search" placeholder="Buscar por nome, cidade, país ou acervo" autocomplete="off">
        <div class="mu-chips" id="mu-tipos" role="group" aria-label="Tipo"></div>
        <div class="mu-chips" id="mu-cont" role="group" aria-label="Continente"></div>
      </section>

      <section id="mu-lista" class="mu-lista" aria-live="polite"></section>

      <p class="mu-nota" id="mu-nota"></p>
    </main>
  </div>
  <script src="museus.js" defer></script>
</body>
</html>
