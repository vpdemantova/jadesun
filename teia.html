<!doctype html>
<!-- Portal Solar · teia.html — a Teia (31/out/2026): a rede de todas as pessoas do Atlas, as famílias, as escolas, os
     movimentos e os grupos, desde o primeiro registro. Pedido dele: "uma rede, network, data visualization, de todas
     as pessoas, por área… desde o primeiro registrado, as famílias, escolas, grupos, e tudo mais". Os dados vêm de
     lib/teia.mjs (as fichas + os elos do Wikidata, colhidos pelo colher-teia.mjs); o desenho é o teia.js. Mora na
     porta das Fichas, ao lado de Quando. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="tema.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0F0E0B">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>A Teia — Portal Solar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Gabarito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&display=swap">
  <link rel="stylesheet" href="perfil.css">
  <link rel="stylesheet" href="fino.css">
  <link rel="stylesheet" href="vidro.css">
  <link rel="stylesheet" href="almanaque.css">
  <link rel="stylesheet" href="solar.css">
  <link rel="stylesheet" href="paginas.css">
  <link rel="stylesheet" href="teia.css">
  <link rel="stylesheet" href="forma.css">
  <link rel="stylesheet" href="casca.css">
  <link rel="stylesheet" href="cores.css">
  <link rel="stylesheet" href="respiro.css">
  <link rel="stylesheet" href="sistema.css">
  <script src="icones.js" defer></script>
  <script src="mapa-dados.js" defer></script>
  <script src="perfil.js" defer blocking="render"></script>
  <script src="solar.js" defer></script>
  <script src="meudia.js" defer></script>
  <script src="lenis.js" defer></script>
  <script src="motion.js" defer></script>
</head>
<body data-pagina="teia">
  <div class="casca">
    <aside class="trilho" id="trilho"></aside>
    <main class="miolo">
      <div class="faixa" id="faixa" aria-hidden="true"></div>
      <header class="topo-pg">
        <p class="rot"><span>Fichas · teia</span></p>
        <h1 class="mega">A Teia</h1>
        <p class="resposta" id="te-resumo">A rede de todas as pessoas do Atlas: quem aprendeu com quem, as famílias, as escolas, os movimentos e os grupos, desde o primeiro registro.</p>
      </header>

      <div class="te-barra">
        <div class="te-vistas" role="group" aria-label="Como ver">
          <button type="button" class="te-vista" data-vista="teia" aria-pressed="true">A teia</button>
          <button type="button" class="te-vista" data-vista="tempo" aria-pressed="false">No tempo</button>
        </div>
        <label class="te-busca"><span class="sr">Buscar</span>
          <input type="search" id="te-q" list="te-nomes" placeholder="Buscar uma pessoa ou um grupo" autocomplete="off">
        </label>
        <datalist id="te-nomes"></datalist>
        <button type="button" class="te-filtros-b" id="te-filtros-b" aria-expanded="false" aria-controls="te-filtros">Filtros</button>
      </div>
      <div class="te-filtros" id="te-filtros" hidden>
        <p class="te-filtros-rot">As áreas</p><div class="te-chips" id="te-areas"></div>
        <p class="te-filtros-rot">Os elos</p><div class="te-chips" id="te-tipos"></div>
      </div>

      <div class="te-palco" id="te-palco">
        <canvas id="te-tela" aria-label="A teia das pessoas: use a busca para escolher alguém; o painel conta os elos"></canvas>
        <div class="te-zoom" role="group" aria-label="Aproximar">
          <button type="button" data-zoom="1" aria-label="Aproximar">+</button>
          <button type="button" data-zoom="-1" aria-label="Afastar">−</button>
          <button type="button" data-zoom="0" aria-label="Ver tudo">Tudo</button>
        </div>
        <p class="te-dica" id="te-dica">Arraste para andar, role ou pince para aproximar, toque numa pessoa.</p>
        <aside class="te-painel" id="te-painel" hidden aria-live="polite"></aside>
        <p class="te-abrindo" id="te-abrindo">Abrindo a teia…</p>
      </div>

      <div class="te-legenda" id="te-legenda"></div>
      <p class="te-fonte" id="te-fonte"></p>
    </main>
  </div>
  <script src="teia.js" defer></script>
</body>
</html>
