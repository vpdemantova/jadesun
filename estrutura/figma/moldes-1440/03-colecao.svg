"8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="426" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A vista</text><text x="76" y="448" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o que a lente mostra; o tamanho não muda entre lentes, o conteúdo rola por dentro</text></g><g id="O pé"><rect x="60" y="1060" width="1320" height="48" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="1089" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B0B0B">O pé</text><text x="125.6" y="1089" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">mais 40 · voltar ao alto</text></g></g><g id="Barra de baixo"><rect x="0" y="1172" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="1172" x2="1440" y2="1172" stroke="#D6D6D6"/><text x="60" y="1209" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757">Dentro de &lt;porta&gt;:</text><text x="196" y="1209" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">as páginas da porta, a atual marcada</text><line x1="720" y1="1190" x2="720" y2="1218" stroke="#D6D6D6"/><text x="760" y="1209" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">os tópicos desta página, o atual acompanha a rolagem</text><text x="1380" y="1209" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757" text-anchor="end">Nesta página</text></g>
