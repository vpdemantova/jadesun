<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2086" viewBox="0 0 390 2086">
<title>Início · 390</title>
<rect id="Fundo" width="390" height="2086" fill="#FFFFFF"/>
<g id="Barra de cima"><rect x="0" y="0" width="390" height="56" fill="#FFFFFF"/><line x1="0" y1="56" x2="390" y2="56" stroke="#D6D6D6"/><rect x="16" y="12" width="80" height="32" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="30" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">Buscar</text><rect x="185" y="18" width="20" height="20" fill="#0B0B0B"/><text x="374" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="end">Ajustes</text></g><g id="Conteúdo"><g id="As boas-vindas"><rect x="16" y="76" width="358" height="294" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="106" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">As boas-vindas</text><text x="32" y="128" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o Quadrado grande, o nome, o lema (&quot;Somos projetos</text><text x="32" y="146" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">do Sol…&quot;), o dia de hoje; e, para quem volta, onde</text><text x="32" y="164" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">parou e a fixada</text></g><g id="O mundo"><rect x="16" y="382" width="358" height="364" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="412" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O mundo</text><text x="32" y="434" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as portas do lado esquerdo do menu, alinhadas ao</text><text x="32" y="452" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">eixo: o nome, a pergunta, as páginas</text></g><g id="O Quadrado"><rect x="16" y="758" width="358" height="140" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="788" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O Quadrado</text><text x="32" y="810" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o mapa de tudo, no eixo</text></g><g id="Você"><rect x="16" y="910" width="358" height="364" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="940" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Você</text><text x="32" y="962" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">as portas do lado direito, alinhadas ao eixo</text></g><g id="O que queremos"><rect x="16" y="1286" width="358" height="270" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1316" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que queremos</text><text x="32" y="1338" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">a utopia, nas palavras dele (A revolução</text><text x="32" y="1356" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">ontológica, lida do caderno)</text></g><g id="A Terra agora"><rect x="16" y="1568" width="358" height="294" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1598" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A Terra agora</text><text x="32" y="1620" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">lente mapa: dia e noite deste minuto</text></g><g id="A linha da obra"><rect x="16" y="1874" width="358" height="54" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="1903" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B0B0B">A linha da obra</text><text x="174" y="1903" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">Portal Solar · uma obra de…</text></g></g><g id="Barras de baixo"><rect x="8" y="1960" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="22" y="1982" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Dentro de &lt;porta&gt;</text><text x="22" y="1999" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">a página atual</text><rect x="199" y="1960" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="213" y="1982" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Nesta página</text><text x="213" y="1999" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">o tópico atual</text><rect x="0" y="2022" width="390" height="64" fill="#FFFFFF"/><line x1="0" y1="2022" x2="390" y2="2022" stroke="#D6D6D6"/><text x="39" y="2059" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Guias</text><text x="117" y="2059" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Atlas</text><rect x="185" y="2044" width="20" height="20" fill="#0B0B0B"/><text x="273" y="2059" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Hoje</text><text x="351" y="2059" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Caderno</text></g>
</svg>
