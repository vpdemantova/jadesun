stroke="#D6D6D6" stroke-width="1"/><text x="76" y="134" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A capa</text><text x="76" y="156" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o nome, quem fez, o estado (em obra, no ar, guardado)</text></g><g id="O que é"><rect x="60" y="448" width="760" height="260" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="478" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que é</text><text x="76" y="500" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">texto corrido</text></g><g id="A ficha técnica"><rect x="844" y="448" width="536" height="260" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="860" y="478" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A ficha técnica</text><text x="860" y="500" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">tábua: tipo, ano, código, licença, endereço</text></g><g id="Abrir"><rect x="60" y="732" width="424" height="56" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="761" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B0B0B">Abrir</text><text x="134" y="761" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">aqui · à parte · os arquivos</text></g><g id="O nível"><rect x="508" y="732" width="872" height="56" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="524" y="761" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B0B0B">O nível</text><text x="598.8" y="761" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">ficha · casca · motor (o quanto já está integrado)</text></g><g id="A obra em si"><rect x="60" y="812" width="1320" height="360" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="842" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">A obra em si</text><text x="76" y="864" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">imagens, a cena ou o próprio app (lente grade ou espaço)</text></g><g id="Os elos"><rect x="60" y="1196" width="1320" height="160" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="76" y="1226" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Os elos</text><text x="76" y="1248" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">quem fez, o que usa, de onde veio</text></g></g><g id="Barra de baixo"><rect x="0" y="1420" width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="1420" x2="1440" y2="1420" stroke="#D6D6D6"/><text x="60" y="1457" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757">Dentro de &lt;porta&gt;:</text><text x="196" y="1457" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">as páginas da porta, a atual marcada</text><line x1="720" y1="1438" x2="720" y2="1466" stroke="#D6D6D6"/><text x="760" y="1457" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B0B0B">os tópicos desta página, o atual acompanha a rolagem</text><text x="1380" y="1457" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="500" fill="#575757" text-anchor="end">Nesta página</text></g>
</svg>
