<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1002" viewBox="0 0 390 1002">
<title>Portão (o primeiro acesso) · 390</title>
<rect id="Fundo" width="390" height="1002" fill="#FFFFFF"/>
<g id="Barra de cima"><rect x="0" y="0" width="390" height="56" fill="#FFFFFF"/><line x1="0" y1="56" x2="390" y2="56" stroke="#D6D6D6"/><rect x="16" y="12" width="80" height="32" rx="16" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="30" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">Buscar</text><rect x="185" y="18" width="20" height="20" fill="#0B0B0B"/><text x="374" y="33" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="end">Ajustes</text></g><g id="Conteúdo"><g id="O que é"><rect x="16" y="76" width="358" height="180" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="106" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">O que é</text><text x="32" y="128" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o Portal é uma lente sobre uma pasta sua;</text><text x="32" y="146" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">desligue-o e tudo continua lá</text></g><g id="Escolher a pasta"><rect x="16" y="268" width="358" height="180" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="298" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Escolher a pasta</text><text x="32" y="320" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">no computador ou no celular</text></g><g id="Começar do modelo"><rect x="16" y="460" width="358" height="180" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="490" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Começar do modelo</text><text x="32" y="512" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o acervo-modelo, para preencher</text></g><g id="Só ler"><rect x="16" y="652" width="358" height="72" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="682" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Só ler</text><text x="32" y="704" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">o acervo público, sem pasta nenhuma</text></g><g id="Onde ficam os seus arquivos"><rect x="16" y="736" width="358" height="108" rx="8" fill="#F2F2F2" stroke="#D6D6D6" stroke-width="1"/><text x="32" y="766" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B0B0B">Onde ficam os seus arquivos</text><text x="32" y="788" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">no seu disco; a conta é a chave da casa, não o</text><text x="32" y="806" font-family="Newsreader, Georgia, serif" font-size="13" font-weight="400" fill="#575757">cofre</text></g></g><g id="Barras de baixo"><rect x="8" y="876" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="22" y="898" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Dentro de &lt;porta&gt;</text><text x="22" y="915" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">a página atual</text><rect x="199" y="876" width="183" height="50" rx="14" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="1"/><text x="213" y="898" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="400" fill="#575757">Nesta página</text><text x="213" y="915" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B0B0B">o tópico atual</text><rect x="0" y="938" width="390" height="64" fill="#FFFFFF"/><line x1="0" y1="938" x2="390" y2="938" stroke="#D6D6D6"/><text x="39" y="975" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Guias</text><text x="117" y="975" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Atlas</text><rect x="185" y="960" width="20" height="20" fill="#0B0B0B"/><text x="273" y="975" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Hoje</text><text x="351" y="975" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="600" fill="#575757" text-anchor="middle">Caderno</text></g>
</svg>
